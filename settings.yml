  packages:
    use_renv: false
    default_packages: []
  git:
    enabled: true
    user_name: ''
    user_email: ''
    hooks:
      data_security: false
  ai:
    enabled: false
    canonical_file: AGENTS.md
    assistants:
    - claude
  scaffold:
    seed_on_scaffold: false
    seed: '123'
    set_theme_on_scaffold: true
    ggplot_theme: theme_minimal
    notebook_format: quarto
    workflow: quarto
    positron: false
    source_all_functions: true
  data: []
  connections:
    default_database: framework
    databases:
      framework:
        driver: sqlite
        database: framework.db
  security:
    sensitive: false
  data_hooks: ~
