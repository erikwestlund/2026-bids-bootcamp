default:
  project_name: 2026-bids-bootcamp
  project_type: course
  tools:
    quarto: false
    renv: false
  author:
    name: ''
    email: ''
    affiliation: ''
  directories: {}
  extra_directories:
  - key: assets
    label: assets
    path: assets
  - key: cohorts
    label: cohorts
    path: cohorts
  - key: estimation_study
    label: estimation-study
    path: estimation-study
  - key: images
    label: images
    path: images
  - key: outputs
    label: outputs
    path: outputs
  render_dirs: {}
